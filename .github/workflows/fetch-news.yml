name: Auto-Sync News Feed

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live News RSS Feeds
        run: python scripts/fetch_news.py

      - name: Commit and Push Updated Feed
        run: |
          git config --global user.name 'NewsColossal Bot'
          git config --global user.email 'bot@newscolossal.internal'
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync live news feeds [skip ci]" && git push)
