name: Daily Digest & Feed Refresh Pipeline

# Runs once per day at 2:00 AM UTC (7:30 AM IST)
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent concurrent runs that could cause push conflicts
concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate daily newsletter digest
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY || '4821cd7d-3406-43fb-8b85-ec98c392cbc9' }}
        run: python generate_daily_newsletter.py
        working-directory: ./

      - name: Commit & push digest
        run: |
          git config user.name "News Colossal Bot"
          git config user.email "bot@newscolossal.com"
          git add -f newsletters/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Daily digest: $(date +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
