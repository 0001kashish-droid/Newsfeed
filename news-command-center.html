<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Command Center</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem;
      --color-bg: #f7f6f2;
      --color-surface: #f9f8f5;
      --color-surface-2: #fbfbf9;
      --color-surface-offset: #f3f0ec;
      --color-surface-dynamic: #e6e4df;
      --color-divider: #dcd9d5;
      --color-border: #d4d1ca;
      --color-text: #28251d;
      --color-text-muted: #67655f;
      --color-text-faint: #9e9b94;
      --color-text-inverse: #f9f8f4;
      --color-primary: #01696f;
      --color-primary-hover: #0c4e54;
      --color-primary-highlight: #cedcd8;
      --color-blue: #006494;
      --color-success: #437a22;
      --color-warning: #964219;
      --radius-sm: 0.375rem; --radius-md: 0.75rem; --radius-lg: 1rem; --radius-xl: 1.25rem; --radius-full: 9999px;
      --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --shadow-md: 0 8px 24px oklch(0.2 0.01 80 / 0.08);
      --shadow-lg: 0 18px 48px oklch(0.2 0.01 80 / 0.12);
      --font-body: 'Satoshi', Inter, sans-serif;
      --content-wide: 1280px;
      --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --modal-backdrop: rgba(0,0,0,0.25);
    }
    [data-theme="dark"] {
      --color-bg: #171614;
      --color-surface: #1c1b19;
      --color-surface-2: #201f1d;
      --color-surface-offset: #23211f;
      --color-surface-dynamic: #2d2c2a;
      --color-divider: #262523;
      --color-border: #393836;
      --color-text: #e3e0d9;
      --color-text-muted: #b0ada4;
      --color-text-faint: #7b776d;
      --color-text-inverse: #171614;
      --color-primary: #4f98a3;
      --color-primary-hover: #6fb1bb;
      --color-primary-highlight: #313b3b;
      --color-blue: #75add8;
      --color-success: #8cc16a;
      --color-warning: #d08b5f;
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
      --shadow-md: 0 8px 24px oklch(0 0 0 / 0.28);
      --shadow-lg: 0 18px 48px oklch(0 0 0 / 0.38);
      --modal-backdrop: rgba(0,0,0,0.4);
    }
    /* (existing CSS is preserved below) */
    /* Modal styles */
    .modal-backdrop {
      position: fixed; inset: 0; background: var(--modal-backdrop); z-index: 4000; display: none;
    }
    .modal-backdrop.active {
      display: block;
    }
    .modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex;
      align-items: center; justify-content: center; z-index: 4010; pointer-events: none;
    }
    .modal.active {
      pointer-events: all;
    }
    .modal-content {
      background: var(--color-surface-2);
      box-shadow: var(--shadow-lg);
      border-radius: var(--radius-xl);
      min-width: min(420px, 88vw);
      max-width: 96vw;
      max-height: 92vh;
      padding: 2.5rem 2.25rem;
      font-family: var(--font-body);
      color: var(--color-text);
      position: relative;
      display: flex; flex-direction: column; gap: 1.1rem;
      animation: fly-in-modal 230ms cubic-bezier(0.33,1,0.68,1);
      overflow-y: auto;
    }
    @keyframes fly-in-modal {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: none; }
    }
    .modal-close-btn {
      outline: none; border: none; background: none; color: var(--color-text-muted);
      position: absolute; top: 18px; right: 18px; cursor: pointer; font-size: 2rem; line-height: 1;
      transition: color 140ms;
    }
    .modal-close-btn:hover {
      color: var(--color-primary);
    }
    .modal-title {
      font-size: var(--text-lg); font-weight: 800; margin-bottom: 0.25rem;
    }
    .modal-meta {
      color: var(--color-text-faint); font-size: var(--text-xs); display: flex; gap: 1.4em; margin-bottom: 0.6rem;
    }
    .modal-desc {
      color: var(--color-text-muted); font-size: var(--text-base); line-height: 1.6; margin-bottom: 1.2rem;
    }
    .modal-actions {
      display: flex; gap: 0.7rem; align-items: center; margin-top: 0.65em;
    }
    .modal-actions a {
      font-weight: 600;
      text-decoration: none;
      min-width: 110px;
      text-align: center;
      display: inline-block;
    }
    .modal-actions .visit-btn {
      background: var(--color-primary); color: var(--color-text-inverse);
      padding: 0.7em 1.4em; border-radius: var(--radius-full);
      transition: background 120ms, color 120ms;
    }
    .modal-actions .visit-btn:hover { background: var(--color-primary-hover); }
    .modal-actions .close-btn {
      color: var(--color-text-faint); padding: 0.7em 1.2em; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface-dynamic);
    }
    .modal-actions .close-btn:hover { color: var(--color-primary); border-color: var(--color-primary-highlight); }
    @media (max-width: 600px) {
      .modal-content { min-width: 0; padding: 1.3rem 0.6rem; }
    }
    /* (preserve and append the rest of your styles here for fluid, rich appearance) */
  </style>
  <style>
    /* Keep rest of original styles here */
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar"> ... (existing header and layout) ... </header>
  <main id="main" class="shell"> ... (existing content) ... </main>
  <!-- Modal Popup for Preview -->
  <div id="modalBackdrop" class="modal-backdrop"></div>
  <div id="modalRoot" class="modal">
    <div class="modal-content" role="dialog" aria-modal="true" tabindex="-1" style="display:none">
      <button class="modal-close-btn" id="closeModalBtn" title="Close preview">&times;</button>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta"><span id="modalSource"></span> <span id="modalTime"></span></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-actions">
        <a id="modalVisitBtn" href="#" target="_blank" rel="noopener noreferrer" class="visit-btn">Read full article</a>
        <button class="close-btn" id="modalCloseBtn2">Close</button>
      </div>
    </div>
  </div>
  <script>
  // --- Modal popup logic for headline previews ---
  document.addEventListener('DOMContentLoaded', function () {
    const modalRoot = document.getElementById('modalRoot');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalContent = modalRoot.querySelector('.modal-content');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalCloseBtn2 = document.getElementById('modalCloseBtn2');
    const modalTitle = document.getElementById('modalTitle');
    const modalSource = document.getElementById('modalSource');
    const modalTime = document.getElementById('modalTime');
    const modalDesc = document.getElementById('modalDesc');
    const modalVisitBtn = document.getElementById('modalVisitBtn');

    function openModal({ title, source, time, desc, url }) {
      modalTitle.textContent = title || '';
      modalSource.textContent = source || '';
      modalTime.textContent = time || '';
      modalDesc.textContent = desc || '';
      modalVisitBtn.href = url || '#';
      modalRoot.classList.add('active');
      modalBackdrop.classList.add('active');
      modalContent.style.display = '';
      setTimeout(() => { modalContent.focus(); }, 50);
    }
    function closeModal() {
      modalRoot.classList.remove('active');
      modalBackdrop.classList.remove('active');
      modalContent.style.display = 'none';
    }
    closeModalBtn.onclick = closeModal;
    modalCloseBtn2.onclick = closeModal;
    modalBackdrop.onclick = closeModal;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });

    // Attach event handler AFTER headlines render. 
    // We'll override the click event on headline links so preview appears instead of new tab.
    function attachHeadlineClickHandlers() {
      document.querySelectorAll('.headline-link').forEach(a => {
        a.onclick = function (e) {
          e.preventDefault();
          // Find info: headline title, description, source, pubDate. These are rendered in inner HTML, so need to traverse DOM:
          const headlineDiv = a.closest('.headline-item');
          const title = a.querySelector('.headline-title')?.textContent || '';
          const desc = a.querySelector('.headline-desc')?.textContent || 'No preview available.';
          const source = a.querySelector('.headline-meta span:nth-child(1)')?.textContent || '';
          const time = a.querySelector('.headline-meta span:nth-child(2)')?.textContent || '';
          const url = a.getAttribute('href');
          openModal({ title, source, time, desc, url });
        };
      });
    }
    // (You may need to re-call this any time headlines are re-rendered)
    window.attachHeadlineClickHandlers = attachHeadlineClickHandlers;
    attachHeadlineClickHandlers();
  });
  // --- END MODAL LOGIC ---
  </script>

    // ...in the renderFeed/feed update code.
  </script>

</body>
</html>
