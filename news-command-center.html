<!DOCTYPE html>

<head>

  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem;
      --color-bg: #f7f6f2;
      --color-surface: #f9f8f5;
      --color-surface-2: #fbfbf9;
      --color-surface-offset: #f3f0ec;
      --color-surface-dynamic: #e6e4df;
      --color-divider: #dcd9d5;
      --color-border: #d4d1ca;
      --color-text: #28251d;
      --color-text-muted: #67655f;
      --color-text-faint: #9e9b94;
      --color-text-inverse: #f9f8f4;
      --color-primary: #01696f;
      --color-primary-hover: #0c4e54;
      --color-primary-highlight: #cedcd8;
      --color-blue: #006494;
      --color-success: #437a22;
      --color-warning: #964219;
      --radius-sm: 0.375rem; --radius-md: 0.75rem; --radius-lg: 1rem; --radius-xl: 1.25rem; --radius-full: 9999px;
      --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --shadow-md: 0 8px 24px oklch(0.2 0.01 80 / 0.08);
      --shadow-lg: 0 18px 48px oklch(0.2 0.01 80 / 0.12);
      --font-body: 'Satoshi', Inter, sans-serif;
      --content-wide: 1280px;
      --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --modal-backdrop: rgba(0,0,0,0.25);
    }
    [data-theme="dark"] {
      --color-bg: #171614;
      --color-surface: #1c1b19;
      --color-surface-2: #201f1d;
      --color-surface-offset: #23211f;
      --color-surface-dynamic: #2d2c2a;
      --color-divider: #262523;
      --color-border: #393836;
      --color-text: #e3e0d9;
      --color-text-muted: #b0ada4;
      --color-text-faint: #7b776d;
      --color-text-inverse: #171614;
      --color-primary: #4f98a3;
      --color-primary-hover: #6fb1bb;
      --color-primary-highlight: #313b3b;
      --color-blue: #75add8;
      --color-success: #8cc16a;
      --color-warning: #d08b5f;
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
      --shadow-md: 0 8px 24px oklch(0 0 0 / 0.28);
      --shadow-lg: 0 18px 48px oklch(0 0 0 / 0.38);
      --modal-backdrop: rgba(0,0,0,0.4);
    }
    /* Modal and the rest of your CSS remains unchanged for brevity */
  </style>
</head>
<body>
  <!-- ... existing markup ... -->

  <script>
  const FEEDS = { /* ... feed definitions ... */ };
  // ... all the other original JS ...

  /* Fixes: Set 15min auto-refresh and allow manual refresh */
  const refreshBtn = document.getElementById('refreshBtn');
  const liveStatus = document.getElementById('liveStatus');
  let refreshInterval = null;

  async function refreshAll() {
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'Refreshing…';
    liveStatus.textContent = 'Refreshing feeds';
    try {
      await Promise.all(Object.keys(FEEDS).map(loadFeed));
      state.lastUpdated = new Date();
      lastUpdatePill.textContent = `Last sync: ${new Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short' }).format(state.lastUpdated)}`;
      liveStatus.textContent = 'Feeds live • auto refresh every 15 minutes';
    } catch (error) {
      liveStatus.textContent = 'One or more feeds are unavailable right now';
      Object.values(FEEDS).forEach(feed => {
        if (!state.stories[Object.keys(FEEDS).find(key => FEEDS[key] === feed)]?.length) {
          feed.target.innerHTML = '<li class="error-state">Feed unavailable at the moment. Use Refresh now to retry.</li>';
        }
      });
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = 'Refresh now';
    }
  }
  function setupAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(refreshAll, 15 * 60 * 1000); // 15 min in ms
  }
  refreshBtn.addEventListener('click', refreshAll);
  setupAutoRefresh();
  refreshAll(); // Initial load
  // ...rest of your existing JS...
  </script>
</body>
</html>
