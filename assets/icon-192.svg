<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#021c38"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Radar / Signal Concentric Rings -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="rgba(2, 132, 199, 0.15)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="96" cy="96" r="54" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5"/>

  <!-- Central Intelligence Core / Glow -->
  <circle cx="96" cy="96" r="38" fill="rgba(2, 132, 199, 0.12)" filter="url(#glow)"/>

  <!-- NC Monogram -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-weight="900" text-anchor="middle">
    <!-- Drop Shadow / Glow for text -->
    <text x="96" y="112" font-size="52" fill="#00f2fe" opacity="0.3" filter="url(#glow)">NC</text>
    <text x="96" y="110" font-size="52" fill="#ffffff" letter-spacing="1.5">NC</text>
  </g>

  <!-- Active Signal Indicator Dot -->
  <circle cx="138" cy="62" r="5" fill="#10b981"/>
  <circle cx="138" cy="62" r="9" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.75"/>
</svg>
