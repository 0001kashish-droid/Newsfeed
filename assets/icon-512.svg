<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#041226"/>
      <stop offset="100%" stop-color="#021c38"/>
    </linearGradient>
    <linearGradient id="borderGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cyanGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas with VisionOS rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="url(#borderGrad512)" stroke-width="4"/>

  <!-- Radar / Signal Concentric Rings -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="rgba(2, 132, 199, 0.16)" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="256" cy="256" r="144" fill="none" stroke="rgba(168, 85, 247, 0.22)" stroke-width="3"/>
  <circle cx="256" cy="256" r="96" fill="rgba(2, 132, 199, 0.12)" filter="url(#glow512)"/>

  <!-- Global Latitude / Longitude Curvature -->
  <ellipse cx="256" cy="256" rx="192" ry="76" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="2"/>
  <ellipse cx="256" cy="256" rx="76" ry="192" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="2"/>

  <!-- NC Monogram -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-weight="900" text-anchor="middle">
    <!-- Ambient Glow behind letters -->
    <text x="256" y="298" font-size="140" fill="#00f2fe" opacity="0.4" filter="url(#glow512)">NC</text>
    <!-- Sharp crisp white letters -->
    <text x="256" y="295" font-size="140" fill="#ffffff" letter-spacing="4">NC</text>
  </g>

  <!-- Live Pulse Beacon Indicator -->
  <circle cx="368" cy="164" r="12" fill="#10b981"/>
  <circle cx="368" cy="164" r="22" fill="none" stroke="#10b981" stroke-width="3" opacity="0.75"/>
</svg>
